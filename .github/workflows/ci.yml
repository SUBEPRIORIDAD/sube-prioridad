name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Python tests and simulators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile main.py
          python -m py_compile mvp_simulator.py
          python -m py_compile bono_solidario_simulator.py
          python -m py_compile test_main.py
          python -m py_compile test_mvp_simulator.py
          python -m py_compile test_bono_solidario_simulator.py

      - name: Run MVP simulator
        run: |
          python mvp_simulator.py

      - name: Run Bono Solidario simulator
        run: |
          python bono_solidario_simulator.py

      - name: Run tests
        run: |
          pytest -q

      - name: Verify MVP simulator output
        run: |
          python - <<'PY'
          from mvp_simulator import run_demo

          result = run_demo()

          assert result["project"] == "SUBE Prioridad"
          assert result["demo_mode"] is True
          assert result["status"] == "valid"
          assert result["assistance_preference"] == "preventiva"

          warnings = result.get("warnings", [])
          assert "Sin integración real con SUBE." in warnings
          assert "Sin conexión real con organismos públicos." in warnings
          assert "Sin procesamiento de datos sensibles reales." in warnings

          print("MVP simulator verified successfully.")
          PY

      - name: Verify MVP sensitive data rejection
        run: |
          python - <<'PY'
          from mvp_simulator import (
              AssistancePreference,
              create_demo_priority_attribute,
              simulate_priority_validation,
          )

          attribute = create_demo_priority_attribute(
              token="demo-priority-attribute-actions",
              assistance_preference=AssistancePreference.PREVENTIVA,
          )

          try:
              simulate_priority_validation(
                  attribute,
                  context={
                      "dni": "12345678",
                      "vehicle_demo_id": "demo-bus-001",
                  },
              )
          except ValueError as exc:
              message = str(exc).lower()
              assert "dni" in message
              print("MVP sensitive data rejection verified successfully.")
          else:
              raise AssertionError("Sensitive data was not rejected by MVP simulator.")
          PY

      - name: Verify Bono Solidario simulator output
        run: |
          python - <<'PY'
          from bono_solidario_simulator import run_demo

          result = run_demo()

          assert result["project"] == "SUBE Prioridad"
          assert result["module"] == "Bono Solidario"
          assert result["demo_mode"] is True
          assert result["status"] == "accepted"
          assert result["solidary_point_demo"] == 1
          assert result["recognition_enabled_by_priority_user"] is True
          assert result["same_transport_context"] is True
          assert result["review_required"] is False
          assert result["risk_flags"] == []

          warnings = result.get("warnings", [])
          assert "Sin integración real con SUBE." in warnings
          assert "Sin integración real con Red SUBE." in warnings
          assert "Sin puntos reales." in warnings
          assert "Sin beneficios reales." in warnings
          assert "El Bono Solidario queda en manos del usuario SUBE Prioridad." in warnings

          print("Bono Solidario simulator verified successfully.")
          PY

      - name: Verify Bono Solidario rejection without priority user decision
        run: |
          python - <<'PY'
          from bono_solidario_simulator import (
              DemoRecognitionLedger,
              SeatType,
              SolidaryRecognitionStatus,
              create_demo_solidary_event,
              create_demo_transport_context,
              simulate_solidary_recognition,
          )

          context = create_demo_transport_context()
          ledger = DemoRecognitionLedger()

          event = create_demo_solidary_event(
              event_demo_id="demo-actions-no-user-decision",
              priority_user_token="demo-priority-user-actions",
              collaborator_token="demo-collaborator-actions",
              priority_user_decides_to_recognize=False,
              seat_type=SeatType.GENERAL_USE,
              voluntary_seat_yield=True,
              transport_context=context,
          )

          result = simulate_solidary_recognition(
              event=event,
              expected_context=context,
              ledger=ledger,
          )

          assert result.status == SolidaryRecognitionStatus.REJECTED
          assert result.solidary_point_demo == 0
          assert result.recognition_enabled_by_priority_user is False
          assert result.review_required is False
          assert "priority_user_did_not_recognize" in result.risk_flags
          assert "no decidió reconocer" in result.reason.lower()
          assert "no es automático" in result.reason.lower()

          print("Bono Solidario optional-user-control rule verified successfully.")
          PY

      - name: Verify Bono Solidario rejection for legal priority seat
        run: |
          python - <<'PY'
          from bono_solidario_simulator import (
              DemoRecognitionLedger,
              SeatType,
              SolidaryRecognitionStatus,
              create_demo_solidary_event,
              create_demo_transport_context,
              simulate_solidary_recognition,
          )

          context = create_demo_transport_context()
          ledger = DemoRecognitionLedger()

          event = create_demo_solidary_event(
              event_demo_id="demo-actions-legal-priority-seat",
              priority_user_token="demo-priority-user-actions",
              collaborator_token="demo-collaborator-actions",
              priority_user_decides_to_recognize=True,
              seat_type=SeatType.LEGAL_PRIORITY,
              voluntary_seat_yield=True,
              transport_context=context,
          )

          result = simulate_solidary_recognition(
              event=event,
              expected_context=context,
              ledger=ledger,
          )

          assert result.status == SolidaryRecognitionStatus.REJECTED
          assert result.solidary_point_demo == 0
          assert "legal_priority_seat_not_eligible" in result.risk_flags
          assert "asientos prioritarios legales" in result.reason.lower()
          assert "asientos de uso general" in result.reason.lower()

          print("Bono Solidario general-use-seat rule verified successfully.")
          PY

      - name: Verify Bono Solidario self-recognition rejection
        run: |
          python - <<'PY'
