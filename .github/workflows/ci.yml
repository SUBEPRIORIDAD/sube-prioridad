name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Python tests and MVP simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile main.py
          python -m py_compile mvp_simulator.py
          python -m py_compile test_main.py
          python -m py_compile test_mvp_simulator.py

      - name: Run MVP simulator
        run: |
          python mvp_simulator.py

      - name: Run tests
        run: |
          pytest -q

      - name: Verify MVP simulator output
        run: |
          python - <<'PY'
          from mvp_simulator import run_demo

          result = run_demo()

          assert result["project"] == "SUBE Prioridad"
          assert result["demo_mode"] is True
          assert result["status"] == "valid"
          assert result["assistance_preference"] == "preventiva"

          warnings = result.get("warnings", [])
          assert "Sin integración real con SUBE." in warnings
          assert "Sin conexión real con organismos públicos." in warnings
          assert "Sin procesamiento de datos sensibles reales." in warnings

          print("MVP simulator verified successfully.")
          PY

      - name: Verify sensitive data rejection
        run: |
          python - <<'PY'
          from mvp_simulator import (
              AssistancePreference,
              create_demo_priority_attribute,
              simulate_priority_validation,
          )

          attribute = create_demo_priority_attribute(
              token="demo-priority-attribute-actions",
              assistance_preference=AssistancePreference.PREVENTIVA,
          )

          try:
              simulate_priority_validation(
                  attribute,
                  context={
                      "dni": "12345678",
                      "vehicle_demo_id": "demo-bus-001",
                  },
              )
          except ValueError as exc:
              message = str(exc).lower()
              assert "dni" in message
              print("Sensitive data rejection verified successfully.")
          else:
              raise AssertionError("Sensitive data was not rejected.")
          PY
