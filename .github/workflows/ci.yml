name: CI

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest fastapi httpx uvicorn pydantic
          fi

      - name: Compile all Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          excluded_parts = {
              ".git",
              ".github",
              ".pytest_cache",
              "__pycache__",
              ".venv",
              "venv",
              "env",
              "site-packages",
          }

          python_files = sorted(
              path
              for path in Path(".").rglob("*.py")
              if not any(part in excluded_parts for part in path.parts)
          )

          print("Python files found:")
          for path in python_files:
              print(f" - {path}")

          failed = []

          for path in python_files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failed.append((path, exc))

          if failed:
              print("\nCompilation failures:")
              for path, exc in failed:
                  print(f" - {path}: {exc}")
              sys.exit(1)

          print(f"\nCompiled {len(python_files)} Python files successfully.")
          PY

      - name: Run stable demo commands when files exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          demo_modules = [
              "bono_solidario_simulator.py",
              "assistance_ecosystem_simulator.py",
              "solidary_sync_security_flow.py",
              "passive_alert_preferences_flow.py",
              "sube_account_preferences_flow.py",
              "validator_trigger_alert_flow.py",
              "solidary_bonus_frontend_flow.py",
              "solidary_bonus_handoff_flow.py",
              "red_sube_discount_policy.py",
              "red_sube_trip_window_matcher.py",
              "mobile_proximity_sync_guard.py",
              "nfc_card_solidary_handoff_flow.py",
              "solidary_sync_channel_selector.py",
              "solidary_bonus_mvp_sync_options.py",
              "solidary_bonus_mvp_accrual_flow.py",
              "solidary_bonus_mvp_end_to_end_flow.py",
          ]

          failed = []

          for module in demo_modules:
              path = Path(module)

              if not path.exists():
                  print(f"Skipping missing optional demo module: {module}")
                  continue

              print(f"Running demo module: {module}")
              completed = subprocess.run(
                  [sys.executable, module],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if completed.returncode != 0:
                  failed.append((module, completed.stdout, completed.stderr))
              else:
                  print(f"OK: {module}")

          if failed:
              print("\nDemo command failures:")
              for module, stdout, stderr in failed:
                  print(f"\n--- {module} STDOUT ---")
                  print(stdout)
                  print(f"\n--- {module} STDERR ---")
                  print(stderr)
              sys.exit(1)

          print("\nAll available demo commands completed successfully.")
          PY

      - name: Run tests
        run: pytest -q
