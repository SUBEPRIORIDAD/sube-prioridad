name: CI

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest fastapi httpx uvicorn pydantic
          fi

      - name: Compile core modules
        run: |
          python -m py_compile main.py
          python -m py_compile validator.py
          python -m py_compile cache_manager.py

      - name: Compile SUBE Prioridad demo modules
        run: |
          python -m py_compile bono_solidario_simulator.py
          python -m py_compile assistance_ecosystem_simulator.py
          python -m py_compile solidary_sync_security_flow.py
          python -m py_compile passive_alert_preferences_flow.py
          python -m py_compile sube_account_preferences_flow.py
          python -m py_compile validator_trigger_alert_flow.py
          python -m py_compile solidary_bonus_frontend_flow.py
          python -m py_compile solidary_bonus_handoff_flow.py
          python -m py_compile red_sube_discount_policy.py
          python -m py_compile red_sube_trip_window_matcher.py
          python -m py_compile mobile_proximity_sync_guard.py
          python -m py_compile nfc_card_solidary_handoff_flow.py
          python -m py_compile solidary_sync_channel_selector.py

      - name: Compile Bono Solidario MVP modules
        run: |
          python -m py_compile solidary_bonus_mvp_sync_options.py
          python -m py_compile solidary_bonus_mvp_accrual_flow.py
          python -m py_compile solidary_bonus_mvp_end_to_end_flow.py

      - name: Run stable demo commands
        run: |
          python bono_solidario_simulator.py
          python solidary_sync_security_flow.py
          python passive_alert_preferences_flow.py
          python sube_account_preferences_flow.py
          python validator_trigger_alert_flow.py
          python solidary_bonus_frontend_flow.py
          python solidary_bonus_handoff_flow.py
          python red_sube_discount_policy.py
          python red_sube_trip_window_matcher.py
          python mobile_proximity_sync_guard.py
          python nfc_card_solidary_handoff_flow.py
          python solidary_sync_channel_selector.py
          python solidary_bonus_mvp_sync_options.py
          python solidary_bonus_mvp_accrual_flow.py
          python solidary_bonus_mvp_end_to_end_flow.py

      - name: Run tests
        run: pytest -q
