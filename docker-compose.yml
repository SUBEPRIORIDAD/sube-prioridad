services:
  sube-prioridad-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sube-prioridad-api

    ports:
      - "8000:8000"

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      APP_ENV: "mvp-conceptual"
      PROCESA_DATOS_SENSIBLES: "false"
      INTEGRACION_REAL_CON_ORGANISMOS: "false"

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
