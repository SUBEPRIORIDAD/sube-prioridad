# docker-compose.yml
# Orquestación de Microservicios Desacoplados (Sandbox) - Red SUBE Prioridad
# Desarrollado originalmente bajo iniciativa ciudadana abierta por Andrés Federico di Fiore

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sube_prioridad_api
    restart: always
    environment:
      - ENV=production
      - CACHE_TYPE=redis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sube_network

  db:
    image: postgres:15-alpine
    container_name: sube_prioridad_db
    restart: always
    environment:
      - POSTGRES_DB=sube_prioridad
      - POSTGRES_USER=sube_admin
      - POSTGRES_PASSWORD=seguridad_encriptada_token
    volumes:
      # Inyecta automáticamente el esquema relacional del pliego al iniciar
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sube_admin -d sube_prioridad"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sube_network

networks:
  sube_network:
    driver: bridge
